<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SocialTunnel</title>
  <!-- Bootstrap supplies the common page layout, form, button, and card styles. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
  <!-- A small heading at the top of every screen. -->
  <nav class="navbar navbar-dark bg-success border-bottom shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="/">SocialTunnel</a>
      <span class="navbar-text small text-white-50">Exclusive Map2Tech social network</span>
    </div>
  </nav>

  <!-- Django sends this page; JavaScript below fills it with API results. -->
  <main class="container py-4 py-md-5">
    <!-- Visitors use this form to log in or create an account. -->
    <div id="login-section" class="row justify-content-center">
      <div class="col-12 col-md-7 col-lg-5">
        <div class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-2">Welcome</h1>
            <p class="text-secondary mb-4">Log in or create an account to see your feed.</p>
            <form id="auth-form">
              <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input class="form-control" type="text" id="username" name="username" autocomplete="username" required>
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
              </div>
              <div class="d-flex flex-wrap gap-2">
                <button class="btn btn-primary" type="submit">Log in</button>
                <button class="btn btn-outline-secondary" id="signup-button" type="button">Create account</button>
              </div>
            </form>
            <p id="auth-status" class="small mt-3 mb-0" role="status" aria-live="polite"></p>
          </div>
        </div>
      </div>
    </div>

    <!-- JavaScript shows this area after the server accepts the user's token. -->
    <div id="dashboard-section" class="hidden">
      <div class="d-flex flex-wrap align-items-center justify-content-between gap-3 mb-4">
        <div>
          <h1 class="h3 mb-1">Welcome, <span id="welcome-name">friend</span></h1>
          <p class="text-secondary mb-0">Your direct messages.</p>
        </div>
        <button id="logout-button" class="btn btn-outline-secondary btn-sm" type="button">Log out</button>
      </div>

      <!--
        The grid assigns the narrower left column to member discovery and the
        wider right column to conversation controls and message history.
      -->
      <div class="row g-4">
        <!-- The feed is hidden while this dashboard focuses on messaging. -->
        <!--
        <section class="col-12 col-lg-6" aria-labelledby="feed-title">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h2 id="feed-title" class="h5 mb-0">Your feed</h2>
              <button id="refresh-feed" class="btn btn-outline-primary btn-sm" type="button">Refresh</button>
            </div>
            <div class="card-body border-bottom">
              <form id="post-form">
                <label for="post-content" class="form-label">Write a post</label>
                <textarea class="form-control" id="post-content" name="content" rows="3" maxlength="500" placeholder="What's on your mind?" required></textarea>
                <div class="d-flex justify-content-between align-items-center mt-2">
                  <small class="text-secondary">Up to 500 characters</small>
                  <button id="post-button" class="btn btn-primary btn-sm" type="submit">Post</button>
                </div>
              </form>
            </div>
            <div id="feed-content" class="card-body">
              <p class="text-secondary mb-0">Loading posts…</p>
            </div>
          </div>
        </section>
        -->

        <!-- This column lists members available for one-to-one conversations. -->
        <aside class="col-12 col-lg-4" aria-labelledby="user-list-title">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-white d-flex justify-content-between align-items-center">
              <h2 id="user-list-title" class="h5 mb-0">Members</h2>
              <span id="user-count-badge" class="badge rounded-pill text-bg-success">0</span>
            </div>
            <div id="user-registry-list" class="list-group list-group-flush" aria-label="Active members"></div>
          </div>
        </aside>

        <!-- This wider column contains conversation controls and message history. -->
        <section class="col-12 col-lg-8" aria-labelledby="messages-title">
          <div class="card shadow-sm h-100">
            <div class="card-header bg-success text-white">
              <h2 id="messages-title" class="h5 mb-0">Direct messages</h2>
            </div>
            <div class="card-body">
              <form id="conversation-form" class="input-group mb-3">
                <label for="recipient" class="visually-hidden">Username</label>
                <input class="form-control" id="recipient" name="recipient" autocomplete="off" placeholder="Username to message" required>
                <button class="btn btn-outline-success" type="submit">Open</button>
              </form>
              <p id="conversation-label" class="small text-secondary">Choose a username to open a conversation.</p>
              
              <!-- Chat History display drawer -->
              <div id="messages" class="message-list border rounded p-3 mb-3" aria-live="polite" style="height: 300px; overflow-y: auto; background-color: var(--bs-gray-100);">
                <p class="small text-secondary mb-0">No conversation open.</p>
              </div>
              
              <form id="message-form">
                <label for="message-text" class="visually-hidden">Your message</label>
                <textarea class="form-control" id="message-text" name="message" rows="2" maxlength="2000" placeholder="Write a message" required disabled></textarea>
                <button id="send-button" class="btn btn-success mt-2" type="submit" disabled>Send</button>
              </form>
            </div>
          </div>
        </section>
      </div>
      <p id="app-status" class="small mt-3" role="status" aria-live="polite"></p>
    </div>
  </main>
  <script src="/static/js/home.js"></script>
</body>
</html>
